name: Secret Scan

on:
  push:
  pull_request:

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Block hardcoded secret literals (P0-02)
        run: python3 scripts/check_secrets.py --all

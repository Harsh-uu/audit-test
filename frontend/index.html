<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <meta name="description" content="Supervision2 — AI-powered supervision and compliance platform for social care" />
        <!--
          H1: Content-Security-Policy on the SPA document itself.
          The backend CSP middleware only covers API responses; this meta tag
          protects the app shell. Any injected script that tries to exfiltrate
          localStorage tokens (JWTs) will be blocked before it can execute.
          The sha256 hash covers the single inline DataCloneError suppressor.
        -->
        <meta http-equiv="Content-Security-Policy" content="
          default-src 'self';
          script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com;
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
          font-src 'self' https://fonts.gstatic.com data:;
          img-src 'self' data: blob: https://orsxhtlpybxoexdjrbnx.supabase.co;
          connect-src 'self' https:;
          object-src 'none';
          base-uri 'self';
          form-action 'self';
        " />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" />
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
        <link rel="icon" type="image/svg+xml" href="/logo.svg" />
        <title>Supervision2</title>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>

        <!-- Vite entry point -->
        <script type="module" src="/src/index.js"></script>
    </body>
</html>
